name: Platform quality

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-quality.yml"
      - "docs/architecture.md"
      - "docs/course-platform-requirements.md"
      - "adr/0005-course-platform-control-plane.md"
      - "adr/0006-single-vercel-project-for-course-platform.md"
      - "adr/0007-neon-postgres-for-course-platform.md"
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/platform-quality.yml"
      - "docs/architecture.md"
      - "docs/course-platform-requirements.md"
      - "adr/0005-course-platform-control-plane.md"
      - "adr/0006-single-vercel-project-for-course-platform.md"
      - "adr/0007-neon-postgres-for-course-platform.md"

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: course_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-example-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d course_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://platform:ci-example-not-a-secret@127.0.0.1:5432/course_platform

      - name: Authentication integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://platform:ci-example-not-a-secret@127.0.0.1:5432/course_platform
          APP_ORIGIN: http://localhost:3000
          AUTH_SECRET: ci-example-not-a-secret-change-before-production
          VERCEL_ENV: development

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
