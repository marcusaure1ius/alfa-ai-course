name: Platform quality

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-quality.yml"
      - "docs/architecture.md"
      - "docs/course-platform-requirements.md"
      - "adr/0005-course-platform-control-plane.md"
      - "adr/0006-single-vercel-project-for-course-platform.md"
      - "adr/0007-neon-postgres-for-course-platform.md"
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - ".github/workflows/platform-quality.yml"
      - "docs/architecture.md"
      - "docs/course-platform-requirements.md"
      - "adr/0005-course-platform-control-plane.md"
      - "adr/0006-single-vercel-project-for-course-platform.md"
      - "adr/0007-neon-postgres-for-course-platform.md"

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
